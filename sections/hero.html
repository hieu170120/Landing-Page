<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hero Section</title>

    <style>
      .hero-section {
        padding: 100px 0 80px;
        background: linear-gradient(180deg, #f8f9fc 0%, #ffffff 100%);
      }

      .hero-content {
        max-width: 720px;
      }

      .hero-content h1 {
        font-size: 3rem;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 20px;
        color: #1f2937;
      }

      .hero-content p {
        font-size: 1.1rem;
        color: #6b7280;
        margin-bottom: 32px;
      }

      .hero-actions {
        display: flex;
        gap: 16px;
        margin-bottom: 32px;
      }

      .hero-trust {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        font-size: 0.95rem;
        color: #6b7280;
      }
      .container {
        width: 90%;
        max-width: 1200px;
        margin: 0 auto;
      }
    </style>
  </head>

  <body>
    <section id="hero" class="hero-section">
      <div class="container">
        <div class="hero-content">
          <h1>
            Simple Pricing.<br />
            Powerful Features.
          </h1>

          <p>
            Everything you need to build, scale, and manage your projects — with
            transparent pricing and no hidden fees.
          </p>

          <div class="hero-actions">
            <a href="#pricing" class="btn btn-primary">View Pricing</a>
            <a href="#features" class="btn btn-outline">Learn More</a>
          </div>

          <div class="hero-trust">
            <span>No credit card required</span>
            <span>Cancel anytime</span>
            <span>Trusted by 10,000+ users</span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
